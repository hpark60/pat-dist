<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RN–의사 공정 배정</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color:#222; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; height: 200px; font-family: monospace; font-size: 14px; box-sizing: border-box; }
  label, button { font-size: 15px; }
  button { padding: 8px 18px; margin-left: 8px; cursor: pointer; }
  table { border-collapse: collapse; margin-top: 14px; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
  th { background: #f3f3f3; }
  canvas { margin-top: 14px; max-width: 100%; border: 1px solid #ddd; }
  #status { color: #888; margin-top: 8px; }
</style>
</head>
<body>
<h1>의사(Physician) → 간호사(RN) 공정 배정</h1>
<p>한 줄에 <b>의사이름 환자수</b> (쉼표/탭 구분 가능). 간호사 간 환자 수 차이가 최소가 되도록 배정합니다.</p>

<textarea id="input">Dr. Silverman 81
Dr. Robson 48
Dr. Glenns 50
Dr. Fishman 55
Dr. Myers 67
Dr. Ingber 74
Dr. Roitman 80
Dr. Silverman 81
Dr. Yu 102</textarea>
<p>
  <label>간호사 수:
    <select id="k"><option>3</option><option>4</option></select>
  </label>
  <button py-click="run">배정하기</button>
</p>
<div id="status">Python(Pyodide) 로딩 중…</div>
<div id="result"></div>
<canvas id="cv" width="760" height="10" style="display:none"></canvas>
<p><a id="dl" download="assignment.png" style="display:none">📷 이미지(PNG)로 저장</a></p>

<script type="py">
import re
from itertools import product
from pyscript import document

def parse(text):
    rows = []
    for line in text.strip().splitlines():
        line = re.sub(r"\s*RN\s*\d+\s*$", "", line.strip(), flags=re.I)
        m = re.match(r"^(.*?)[\s,\t]+(\d+)$", line)
        if m:
            rows.append((m.group(1).strip(), int(m.group(2))))
    return rows

def greedy(counts, k):
    loads = [0] * k
    assign = [0] * len(counts)
    for i in sorted(range(len(counts)), key=lambda i: -counts[i]):
        j = loads.index(min(loads))
        assign[i] = j
        loads[j] += counts[i]
    return assign, loads

def exact(counts, k):
    n = len(counts)
    best = None
    for rest in product(range(k), repeat=n - 1):   # 첫 의사는 RN1 고정(대칭 제거)
        a = (0,) + rest
        loads = [0] * k
        for c, r in zip(counts, a):
            loads[r] += c
        key = (max(loads) - min(loads), max(loads))
        if best is None or key < best[0]:
            best = (key, list(a), loads)
    return best[1], best[2]

def run(event):
    rows = parse(document.getElementById("input").value)
    k = int(document.getElementById("k").value)
    if len(rows) < k:
        document.getElementById("result").innerHTML = "<p>의사 수가 간호사 수보다 적습니다.</p>"
        return
    counts = [c for _, c in rows]
    assign, loads = exact(counts, k) if len(rows) <= 12 else greedy(counts, k)
    method = "완전탐색(최적해)" if len(rows) <= 12 else "그리디(LPT)"

    html = "<table><tr><th>Physician</th><th>Patients</th><th>Assigned RN</th></tr>"
    for (name, c), a in zip(rows, assign):
        html += f"<tr><td>{name}</td><td>{c}</td><td>RN {a+1}</td></tr>"
    html += "</table><table><tr><th>Nurse</th><th>Physician Assignment</th><th>Total Patients</th></tr>"
    for j in range(k):
        names = ", ".join(rows[i][0] for i in range(len(rows)) if assign[i] == j)
        html += f"<tr><td>RN {j+1}</td><td>{names}</td><td>{loads[j]}</td></tr>"
    html += f"</table><p>총 {sum(counts)}명 · 이상적 평균 {sum(counts)/k:.1f}명 · 최대−최소 차이 {max(loads)-min(loads)} · 방식: {method}</p>"
    document.getElementById("result").innerHTML = html
    document.getElementById("status").innerText = ""

    # PNG 이미지 생성
    cv = document.getElementById("cv")
    h = 70 + 34 * k
    cv.width, cv.height = 760, h
    ctx = cv.getContext("2d")
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 760, h)
    ctx.fillStyle = "#000"; ctx.font = "bold 16px sans-serif"
    ctx.fillText("Nurse", 16, 28); ctx.fillText("Physician Assignment", 90, 28); ctx.fillText("Total Patients", 600, 28)
    ctx.font = "16px sans-serif"
    for j in range(k):
        y = 62 + 34 * j
        names = ", ".join(rows[i][0].replace("Dr. ", "") for i in range(len(rows)) if assign[i] == j)
        ctx.fillText(f"RN {j+1}", 16, y); ctx.fillText(names, 90, y); ctx.fillText(str(loads[j]), 640, y)
    cv.style.display = "block"
    dl = document.getElementById("dl")
    dl.href = cv.toDataURL("image/png")
    dl.style.display = "inline"

document.getElementById("status").innerText = "준비 완료 — [배정하기]를 누르세요."
</script>
</body>
</html>
